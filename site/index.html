<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA · English Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #05070f;
      overflow: hidden;
      position: relative;
      color: #fff;
    }
    /* 背景光晕 */
    .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; pointer-events: none; }
    .glow-1 { width: 420px; height: 420px; background: #4f7cff; top: -120px; left: -100px; animation: drift 12s ease-in-out infinite alternate; }
    .glow-2 { width: 360px; height: 360px; background: #a44cff; bottom: -100px; right: -80px; animation: drift 14s ease-in-out infinite alternate-reverse; }
    .glow-3 { width: 260px; height: 260px; background: #00d4ff; top: 50%; left: 60%; animation: drift 10s ease-in-out infinite alternate; opacity: .3; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.15); }
    }
    /* 中心卡片 */
    .card {
      position: relative; z-index: 1;
      width: min(88vw, 380px);
      padding: 52px 36px 44px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
    }
    .logo {
      font-size: 88px; font-weight: 800; letter-spacing: 6px; line-height: 1;
      background: linear-gradient(120deg, #6ea8ff, #b06eff 55%, #ff7ac8);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 6px 24px rgba(110, 168, 255, .35));
      animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 6px 24px rgba(110, 168, 255, .30)); }
      50%      { filter: drop-shadow(0 8px 36px rgba(176, 110, 255, .55)); }
    }
    .tagline {
      margin-top: 16px;
      font-size: 15px; font-weight: 600; letter-spacing: 3px;
      color: rgba(255, 255, 255, .75);
      text-transform: uppercase;
    }
    .divider { width: 46px; height: 2px; margin: 26px auto; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); }
    .code {
      width: 100%; padding: 13px 16px;
      text-align: center; font-size: 15px; letter-spacing: 2px;
      color: #eaf2ff;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 12px;
      outline: none;
    }
    .code:focus { border-color: rgba(110, 168, 255, .7); box-shadow: 0 0 0 3px rgba(110, 168, 255, .18); }
    .btn {
      display: block; width: 100%; margin-top: 18px;
      padding: 14px 0;
      font-size: 16px; font-weight: 700; letter-spacing: 6px;
      text-decoration: none; color: #fff; border-radius: 12px;
      background: linear-gradient(120deg, #4f7cff, #a44cff);
      border: none; cursor: pointer;
      box-shadow: 0 12px 30px rgba(79, 124, 255, .35);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(164, 76, 255, .45); filter: brightness(1.08); }
    .btn:active { transform: translateY(0); }
    .hint { margin-top: 14px; font-size: 12px; color: rgba(255, 255, 255, .4); letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="card">
    <div class="logo">EA</div>
    <div class="tagline">English Assistant</div>
    <div class="divider"></div>
    <input type="text" class="code" id="code" value="在这里填写密码" readonly>
    <a id="downloadBtn" href="#" class="btn">下载</a>
    <div class="hint">EA · Download</div>
  </div>
</body>
</html>
